<mat-grid-list cols="4" rowHeight="100px">
  @for (tile of tiles; track tile) {
  <mat-grid-tile [colspan]="tile.cols" [rowspan]="tile.rows"
    [style.background]="tile.color">{{tile.text}}</mat-grid-tile>
  }
</mat-grid-list>


<mat-grid-list cols="2" rowHeight="100px">
  <mat-grid-tile [colspan]="1" [rowspan]="1" [style.background]="'magenta'">
    <mat-toolbar color="primary">
      <span>Jackdaw</span>
      <div class="nav-links">
        <button mat-button routerLink="/">Home</button>
        <button mat-button routerLink="/about">About</button>
        <button mat-button routerLink="/contact">Contact</button>
      </div>
    </mat-toolbar>
  </mat-grid-tile>
</mat-grid-list>



<button (click)="enable()">Enable</button>
<button (click)="disable()">Disable</button>
Sound Enabled[ {{ myValue }} ]
